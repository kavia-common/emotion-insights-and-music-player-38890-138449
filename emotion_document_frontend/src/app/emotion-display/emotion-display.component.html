<div *ngIf="!!emotions && emotions.length > 0" class="emotion-section">
  <div class="emotion-title">Top 3 Detected Emotions</div>
  <div class="emotion-cards">
    <div class="emotion-card" *ngFor="let em of emotions; let i=index">
      <span class="emo-rank">{{ ['1st','2nd','3rd'][i] || ''}}</span>
      <span class="emo-label">{{ em.emotion }}</span>
      <span class="emo-score">{{ em.score | number:'1.0-2' }}</span>
    </div>
  </div>
</div>
